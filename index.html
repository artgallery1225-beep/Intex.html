<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KnowledgeBase Builder – Mind Map</title>
<style>
:root{--bar:#14284b;--bar2:#1f6fd1;--panel:#f4f5fa;--text:#1d2433}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:var(--text)}
#view{position:absolute;inset:0;touch-action:none;background:#eef0f6;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:150px;min-height:40px;padding:4px 6px;border-radius:2px;color:#fff;font-size:13px;font-weight:600;line-height:1.1;text-align:center;display:flex;align-items:center;justify-content:center;word-break:break-word;user-select:none;cursor:pointer}
.node.shadow{filter:drop-shadow(6px 6px 3px rgba(0,0,0,.35))}
.node.sel{outline:3px solid #1f6fd1;outline-offset:2px}
.node .note{position:absolute;right:2px;top:1px;font-size:10px}.node .attb{position:absolute;right:2px;bottom:1px;font-size:10px}
#toolbar{position:absolute;top:10px;right:10px;left:70px;max-width:520px;margin-left:auto;height:52px;background:var(--bar);border-radius:14px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:5}
#toolbar button{background:none;border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px}
#toolbar button.on{background:var(--bar2)}
#toolbar button:disabled{opacity:.35}
#toolbar .tag{color:#fff;font-weight:bold;font-size:16px;background:var(--bar2);padding:7px 10px;border-radius:8px}
#menuBtn{position:absolute;top:10px;left:10px;width:52px;height:52px;border-radius:14px;border:0;background:var(--bar);color:#fff;font-size:24px;z-index:6;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--panel);z-index:7;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:3px 0 12px rgba(0,0,0,.4)}
#drawer.open{transform:none}
#dHead{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 70px;font-weight:bold;font-size:18px;border-bottom:1px solid #d6d9e4;min-height:72px}
#dHead span{flex:1}
#dHead button{border:0;background:none;font-size:22px;padding:6px 10px}
#dBody{flex:1;overflow:auto;padding:10px}
.sec{font-size:12px;letter-spacing:1px;color:#5b6783;font-weight:bold;margin:14px 4px 6px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e1e4ee}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-bottom:1px solid #eceef5;background:#fff;font-size:16px;text-align:left;color:var(--text)}
.row:last-child{border-bottom:0}
.row:disabled{color:#a9afbf}
.row .ic{width:26px;text-align:center;font-size:20px}
.row .val{margin-left:auto;color:#5b6783;font-size:14px}
.field{padding:12px 14px;border-bottom:1px solid #eceef5;background:#fff;font-size:15px}
.field label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field input[type=range]{width:100%;margin-top:8px}
.field input[type=text],.field select{width:100%;padding:10px;font-size:15px;border:1px solid #cfd4e2;border-radius:8px}
#toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
#mBox{background:#fff;border-radius:14px;padding:16px;width:min(92vw,420px)}
#mBox h3{margin:0 0 10px}
#mBox textarea{width:100%;height:110px;padding:10px;font-size:16px;border:1px solid #cfd4e2;border-radius:8px}
#mBox .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
#mBox button{padding:10px 16px;border-radius:8px;border:0;font-size:15px}
#mOk{background:var(--bar2);color:#fff}
.small{font-size:13px;color:#5b6783;padding:6px 4px}

#toolbar{left:62px;right:6px;max-width:none;margin:0;padding:0 4px;gap:0;justify-content:space-between;height:54px}
#toolbar button{flex:1 1 0;min-width:0;max-width:44px;width:auto;height:42px;padding:0;display:flex;align-items:center;justify-content:center}
#toolbar button svg{width:22px;height:22px;fill:currentColor}
#toolbar button.txt{font-size:15px;font-weight:bold;max-width:34px}
#menuBtn{z-index:9;display:flex;align-items:center;justify-content:center}
#menuBtn svg{width:26px;height:26px;fill:#fff}
body.railopen #menuBtn{display:none}
#rail{position:absolute;top:0;bottom:0;left:0;width:clamp(78px,21vw,96px);background:#0f2a52;color:#e9eefb;z-index:8;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column;overflow-y:auto;box-shadow:3px 0 12px rgba(0,0,0,.4)}
#rail.open{transform:none}
#rail .top{display:flex;justify-content:space-around;padding:14px 4px 6px}
#rail .top button{background:none;border:0;color:#fff;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#rail .top svg{width:22px;height:22px;fill:currentColor}
#rail .it{background:none;border:0;color:#cfd8ee;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;font-size:12px;line-height:1.15;text-align:center}
#rail .it svg{width:28px;height:28px;fill:currentColor}
#rail hr{border:0;border-top:1px solid #35507f;margin:6px 14px;width:calc(100% - 28px)}
#dHead{padding-left:70px}
#dHead button{display:flex;align-items:center;justify-content:center}
#dHead button svg{width:22px;height:22px;fill:currentColor}
:root{--u:min(1vw,4px);--tb:#162e4e;--ac:#1871b9;--rail:#0d2648;--sep:#2f4562}

#menuBtn svg{width:calc(4.6*var(--u));height:calc(4.6*var(--u))}
body.panelopen #menuBtn{top:calc(1.7*var(--u))}
#rail{width:calc(20.65*var(--u));background:var(--rail);color:#dfe5f0}

#rail #rPin{left:calc(9.3*var(--u))}#rail #rClose{left:calc(16.2*var(--u))}
#rail .top svg{width:calc(3.2*var(--u));height:calc(3.2*var(--u))}
#rail .it{padding:calc(1.75*var(--u)) 0;gap:calc(0.55*var(--u));font-size:calc(2.4*var(--u));line-height:calc(2.8*var(--u));width:100%;color:#dfe5f0}
#rail .it svg{width:calc(4.9*var(--u));height:calc(4.9*var(--u))}

.anchor{position:absolute;left:50%;bottom:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:rgba(255,255,255,.6);border:2px solid rgba(0,0,0,.25);box-sizing:border-box}
#drawer{width:calc(59.3*var(--u));background:#f2f5f9}
#dHead{height:calc(9.9*var(--u));min-height:0;padding:0 calc(1*var(--u)) 0 calc(11.6*var(--u));gap:0;background:#fff;font-size:calc(3.1*var(--u))}
#dHead button{width:calc(6.8*var(--u));height:calc(6.8*var(--u));padding:0}
#dHead button svg{width:calc(3.3*var(--u));height:calc(3.3*var(--u))}
#dBody{padding:0 calc(2.3*var(--u))}
.card{border-radius:calc(2.8*var(--u))}
.row{font-size:calc(3.05*var(--u));height:calc(10*var(--u));padding:0 calc(2.4*var(--u));gap:calc(3*var(--u))}
.row .ic{width:calc(4.2*var(--u));font-size:calc(3.6*var(--u))}
.sec{font-size:calc(2.2*var(--u));margin:calc(3*var(--u)) 0 calc(1.4*var(--u)) calc(1.2*var(--u))}
#tl{position:absolute;left:0;right:0;bottom:0;height:calc(24*var(--u));background:rgba(255,255,255,.96);z-index:4;display:none;border-top:1px solid #cfd4e2;font-size:14px}

#ctx{position:absolute;display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:10px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:3}
#ctx button{width:34px;height:34px;border:0;background:none;border-radius:8px;padding:0;display:flex;align-items:center;justify-content:center;color:#14284b}

.node .lnk{position:absolute;left:3px;top:0;font-size:10px}
.sec2{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:calc(3*var(--u)) calc(2.4*var(--u));margin-top:calc(1*var(--u));font-size:calc(2.2*var(--u));font-weight:700;letter-spacing:.12em;color:#4d5b78;text-align:left}
.sec2:disabled{opacity:.45}
.sec2 svg{width:calc(3.4*var(--u));height:calc(3.4*var(--u));fill:#4d5b78}
.row .ic svg{width:calc(3.9*var(--u));height:calc(3.9*var(--u));fill:currentColor}
.sw{margin-left:auto;width:calc(8*var(--u));height:calc(4.6*var(--u));border-radius:calc(4.6*var(--u));background:#c5cad6;position:relative;flex:none}
.sw i{position:absolute;left:2px;top:2px;width:calc(calc(4.6*var(--u)) - 4px);height:calc(calc(4.6*var(--u)) - 4px);border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ac)}.sw.on i{left:calc(100% - calc(4.6*var(--u)) + 2px)}

#dlgBox{background:#fff;border-radius:14px;padding:16px;width:min(94vw,440px);max-height:88vh;overflow:auto}

#dlgBox input[type=text],#dlgBox input[type=datetime-local],#dlgBox textarea,#dlgBox select{width:100%;padding:10px;font-size:16px;border:1px solid #cfd4e2;border-radius:8px;box-sizing:border-box}
#dlgBox textarea{height:110px}

.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 2px;border:0;border-radius:8px;background:#e8ecf4;font-size:13px}.tabs button.on{background:var(--ac);color:#fff}

.epanes .pane{background:#fff;border:1px solid #d6dbe8;border-radius:8px;height:min(34vh,270px);overflow:auto;padding:10px}
.ed{min-height:100%;outline:none;font-size:17px;line-height:1.5;word-break:break-word}.ed img{max-width:100%}
.ed table,.emenu table{border-collapse:collapse}.ed td,.ed th{border:1px solid #9aa4b8;padding:4px 6px;min-width:34px}.ed th{background:#e8ecf4}
.ed pre{background:#f1f4fa;padding:6px;border-radius:6px;white-space:pre-wrap}.ed blockquote{border-left:3px solid var(--ac);margin:6px 0;padding-left:10px;color:#44506a}
.fx{font-family:Cambria,Georgia,serif;font-style:italic;background:#eef2fa;padding:0 4px;border-radius:3px}
.srcta{width:100%;height:100%!important;min-height:200px;font:13px monospace!important;border:0!important}

.emenu div{display:flex;gap:14px;align-items:center;padding:11px 12px;border-radius:8px;font-size:16px}.emenu div.dis{color:#a5acbb}.emenu div:active{background:#e3eefc}
.emenu .mi{width:26px;text-align:center;font-size:18px;flex:0 0 auto}.emenu .v{margin-left:auto;color:#6b7488}
.sw{margin-left:auto;width:38px;height:22px;border-radius:11px;background:#c9ced9;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ac)}.sw.on:after{left:19px}
